name: Build SG Clock APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Ecrire le projet Android
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'EOF_A'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'SGClock'
          include ':app'
          EOF_A
          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'EOF_B'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_B
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_C'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx3g
          EOF_C
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'EOF_D'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.sg9fex.floatingtimer'
            compileSdk 34
            defaultConfig {
              applicationId 'com.sg9fex.floatingtimer'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF_D
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <application
                  android:label="SG Clock"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="floating_timer_overlay"/>
                  </service>
              </application>
          </manifest>
          EOF_E
          mkdir -p $(dirname app/src/main/java/com/sg9fex/floatingtimer/MainActivity.java)
          cat > app/src/main/java/com/sg9fex/floatingtimer/MainActivity.java <<'EOF_F'
          package com.sg9fex.floatingtimer;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;

          /* Aucun écran : ouvrir l'appli affiche directement le timer flottant. */
          public class MainActivity extends Activity {
            private boolean asked = false;

            @Override protected void onResume() {
              super.onResume();
              if (Settings.canDrawOverlays(this)) {
                startForegroundService(new Intent(this, OverlayService.class));
                finish();
              } else if (!asked) {
                asked = true;
                Toast.makeText(this, "Autorise « Affichage par-dessus les autres applis » pour SG Clock", Toast.LENGTH_LONG).show();
                startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
              } else {
                finish();
              }
            }
          }
          EOF_F
          mkdir -p $(dirname app/src/main/java/com/sg9fex/floatingtimer/OverlayService.java)
          cat > app/src/main/java/com/sg9fex/floatingtimer/OverlayService.java <<'EOF_G'
          package com.sg9fex.floatingtimer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import org.json.JSONArray;

          public class OverlayService extends Service {
            private static final int PASSIVE = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS;
            private static final int ACTIVE = WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS;
            private static final int CAP = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS;

            private final Handler ui = new Handler(Looper.getMainLooper());
            private WindowManager wm;
            private WebView web;
            private View cap;
            private WindowManager.LayoutParams webLp, capLp;
            private float dens = 1f;
            private int sw, sh;
            private boolean full = false;

            @Override public IBinder onBind(Intent i) { return null; }

            @Override public int onStartCommand(Intent i, int f, int id) {
              startFg();
              if (web == null) createOverlay();
              return START_STICKY;
            }

            private void startFg() {
              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              nm.createNotificationChannel(new NotificationChannel("timer", "SG Clock", NotificationManager.IMPORTANCE_LOW));
              PendingIntent pi = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
              Notification n = new Notification.Builder(this, "timer")
                  .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                  .setContentTitle("SG Clock")
                  .setContentText("Touche pour ouvrir")
                  .setContentIntent(pi)
                  .setOngoing(true)
                  .build();
              if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
              else startForeground(1, n);
            }

            private void readScreen() {
              if (Build.VERSION.SDK_INT >= 30) {
                Rect b = wm.getMaximumWindowMetrics().getBounds();
                sw = b.width(); sh = b.height();
              } else {
                DisplayMetrics m = new DisplayMetrics();
                wm.getDefaultDisplay().getRealMetrics(m);
                sw = m.widthPixels; sh = m.heightPixels;
              }
            }

            private void createOverlay() {
              wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              dens = getResources().getDisplayMetrics().density;
              readScreen();

              web = new WebView(this);
              web.setBackgroundColor(Color.TRANSPARENT);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.addJavascriptInterface(new Bridge(), "AndroidBridge");
              web.loadUrl("file:///android_asset/chrono.html");

              webLp = new WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  PASSIVE, PixelFormat.TRANSLUCENT);
              webLp.gravity = Gravity.TOP | Gravity.START;
              if (Build.VERSION.SDK_INT >= 28) webLp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              wm.addView(web, webLp);

              /* petite fenêtre invisible posée sur le timer : elle capte les touches et les renvoie à la page */
              cap = new View(this);
              cap.setOnTouchListener((v, e) -> {
                MotionEvent c = MotionEvent.obtain(e);
                c.setLocation(e.getRawX(), e.getRawY());
                web.dispatchTouchEvent(c);
                c.recycle();
                return true;
              });
              capLp = new WindowManager.LayoutParams(1, 1, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, CAP, PixelFormat.TRANSLUCENT);
              capLp.gravity = Gravity.TOP | Gravity.START;
              if (Build.VERSION.SDK_INT >= 28) capLp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              cap.setVisibility(View.GONE);
              wm.addView(cap, capLp);
            }

            private void setFull(boolean b) {
              if (b == full || web == null) return;
              full = b;
              webLp.flags = b ? ACTIVE : PASSIVE;
              wm.updateViewLayout(web, webLp);
            }

            private void applyRects(String json) {
              if (web == null) return;
              try {
                JSONArray a = new JSONArray(json);
                if (a.length() == 0) { cap.setVisibility(View.GONE); setFull(false); return; }
                double l = 1e9, t = 1e9, r = -1e9, b = -1e9;
                boolean big = false;
                for (int i = 0; i < a.length(); i++) {
                  JSONArray q = a.getJSONArray(i);
                  double x = q.getDouble(0) * dens, y = q.getDouble(1) * dens, w = q.getDouble(2) * dens, h = q.getDouble(3) * dens;
                  if (w * h >= 0.8 * sw * sh) big = true;
                  l = Math.min(l, x); t = Math.min(t, y); r = Math.max(r, x + w); b = Math.max(b, y + h);
                }
                if (big) { cap.setVisibility(View.GONE); setFull(true); return; }
                int pad = (int) (12 * dens);
                int L = Math.max(0, (int) l - pad), T = Math.max(0, (int) t - pad);
                int R = Math.min(sw, (int) r + pad), B = Math.min(sh, (int) b + pad);
                if (R <= L || B <= T) { cap.setVisibility(View.GONE); setFull(false); return; }
                setFull(false);
                capLp.x = L; capLp.y = T; capLp.width = R - L; capLp.height = B - T;
                cap.setVisibility(View.VISIBLE);
                wm.updateViewLayout(cap, capLp);
              } catch (Exception ignored) { }
            }

            private class Bridge {
              @JavascriptInterface public void rects(String json) { ui.post(() -> applyRects(json)); }
              @JavascriptInterface public void close() { ui.post(() -> OverlayService.this.stopSelf()); }
            }

            @Override public void onConfigurationChanged(Configuration c) {
              super.onConfigurationChanged(c);
              if (wm != null) { dens = getResources().getDisplayMetrics().density; readScreen(); }
            }

            @Override public void onDestroy() {
              try { if (cap != null) wm.removeView(cap); } catch (Exception ignored) { }
              try { if (web != null) { wm.removeView(web); web.destroy(); } } catch (Exception ignored) { }
              web = null; cap = null;
              super.onDestroy();
            }
          }
          EOF_G
          mkdir -p $(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_H'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@android:color/transparent"/>
          </adaptive-icon>
          EOF_H
