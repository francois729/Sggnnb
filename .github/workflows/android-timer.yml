            const k=Math.max(0,Math.min(1.5,(+S.gpi||0)/100)),sa=1+(P[0]-1)*k,c=1+(P[1]-1)*k,b=P[2]*k,wm=P[3]*k,lr=.2126,lg=.7152,lb=.0722;
